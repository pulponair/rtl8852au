name: Build Kernel Module

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        kernel: [ "6.8.0-40-generic", "6.14.0-1-generic" ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git bc flex bison libelf-dev \
            linux-headers-${{ matrix.kernel }}

      - name: Build Kernel Module
        run: |
          KSRC="/usr/src/linux-headers-${{ matrix.kernel }}"
          echo "Building against kernel headers in $KSRC"
          make clean
          make -j$(nproc) KSRC="$KSRC"