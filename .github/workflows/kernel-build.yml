name: Build Kernel Module

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: [ "6.8", "6.13", "6.14" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare APT cache
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}
          restore-keys: |
            apt-cache-

      - name: Prepare apt (disable man-db)
        run: |
          sudo apt-get purge -y man-db || true
          sudo apt-get update

      - name: Install Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev wget curl ca-certificates \
            tar xz-utils

          # Entferne Dokumentation & Manpages
          sudo rm -rf /usr/share/{man,doc,info,locale} || true

      - name: Cache Kernel Headers
        uses: actions/cache@v3
        with:
          path: kernel-headers-${{ matrix.kernel }}
          key: kernel-headers-${{ matrix.kernel }}
        id: kernel_cache

      - name: Download Kernel Headers (mainline)
        if: steps.kernel_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kernel-headers-${{ matrix.kernel }}
          cd kernel-headers-${{ matrix.kernel }}
          KVER=${{ matrix.kernel }}
          BASE_URL="https://kernel.ubuntu.com/mainline/v${KVER}/amd64/"
          echo "Fetching kernel headers for $KVER from $BASE_URL"

          INDEX=$(mktemp)
          curl -sSL "$BASE_URL" -o "$INDEX"

          HEADERS_ALL=$(grep -oP 'linux-headers-([^>]*)_all\.deb' "$INDEX" | head -n1)
          HEADERS_GENERIC=$(grep -oP 'linux-headers-([^>]*)-generic_([^>]*)_amd64.deb' "$INDEX" | head -n1)

          if [[ -z "$HEADERS_ALL" || -z "$HEADERS_GENERIC" ]]; then
            echo "Could not find headers for $KVER"
            cat "$INDEX"
            exit 1
          fi

          echo "Downloading: $HEADERS_ALL and $HEADERS_GENERIC"
          wget -q ${BASE_URL}${HEADERS_ALL}
          wget -q ${BASE_URL}${HEADERS_GENERIC}

      - name: Install Kernel Headers
        run: |
          sudo dpkg -i kernel-headers-${{ matrix.kernel }}/linux-headers-*.deb

      - name: Build Kernel Module
        run: |
          KSRC=$(ls -d /usr/src/linux-headers-* | grep generic | head -n1)
          echo "Building against kernel headers in $KSRC"
          make clean
          make -j$(nproc) KSRC="$KSRC"
