name: Build Kernel Module

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        kernel: [ "6.8.0-40-generic", "6.14.0-1-generic" ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential bc flex bison libelf-dev

      - name: Cache Kernel Headers
        id: cache-headers
        uses: actions/cache@v3
        with:
          path: /usr/src/linux-headers-${{ matrix.kernel }}
          key: kernel-headers-${{ matrix.kernel }}

      - name: Install Kernel Headers
        if: steps.cache-headers.outputs.cache-hit != 'true'
        run: |
          echo "Kernel headers not found in cache. Installing..."
          sudo apt-get install -y --no-install-recommends linux-headers-${{ matrix.kernel }}

      - name: Build Module
        run: |
          KSRC="/usr/src/linux-headers-${{ matrix.kernel }}"
          echo "Building with headers from $KSRC"
          make clean
          make -j$(nproc) KSRC="$KSRC"