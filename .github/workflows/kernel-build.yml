name: Build Kernel Module

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: [ "6.8.0", "6.13.0", "6.14.0" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable ccache
        run: |
          sudo apt update
          sudo apt install -y ccache
          echo "CC='ccache gcc'" >> $GITHUB_ENV
          echo "CXX='ccache g++'" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.kernel }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.kernel }}-

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev wget curl ca-certificates \
            tar xz-utils ccache

          # Platz sparen
          sudo rm -rf /usr/share/doc /usr/share/man

      - name: Download Kernel Headers
        run: |
          KVER=${{ matrix.kernel }}
          BASE_URL="https://kernel.ubuntu.com/~kernel-ppa/mainline/v${KVER}/amd64"

          echo "Fetching kernel headers for $KVER from $BASE_URL"

          HEADERS_ALL=$(curl -s ${BASE_URL}/ | grep -oP "linux-headers-${KVER}-.*?all\.deb" | head -n1)
          HEADERS_AMD64=$(curl -s ${BASE_URL}/ | grep -oP "linux-headers-${KVER}-.*?amd64\.deb" | head -n1)

          if [ -z "$HEADERS_ALL" ] || [ -z "$HEADERS_AMD64" ]; then
            echo "Kernel headers not found for $KVER"
            exit 1
          fi

          wget ${BASE_URL}/${HEADERS_ALL}
          wget ${BASE_URL}/${HEADERS_AMD64}
          sudo dpkg -i linux-headers-${KVER}-*.deb

      - name: Build Kernel Module
        run: |
          KVER=${{ matrix.kernel }}
          KSRC="/usr/src/linux-headers-${KVER}-generic"
          echo "Building against kernel headers in $KSRC"
          make clean
          make -j$(nproc) KSRC="$KSRC"

      - name: Show ccache statistics
        run: ccache -s
